<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>食譜筆記 Recipe Book</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1115;
      --bg-elev: #181b21;
      --bg-card: #1d2129;
      --bg-card-hover: #252a34;
      --bg-chip: #282d38;
      --border: #2c323f;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #ff8c38;
      --accent-soft: rgba(255, 140, 56, 0.14);
      --accent-text: #ffb074;
      --check-bg: rgba(52, 211, 153, 0.14);
      --check-border: #34d399;
      --check-text: #6ee7b7;
      --warn-bg: rgba(251, 191, 36, 0.12);
      --warn-text: #fbbf24;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    [data-theme="light"] {
      --bg: #faf7f2;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #fffbf6;
      --bg-chip: #f2ece4;
      --border: #e6dfd5;
      --text: #1f242d;
      --text-muted: #68707d;
      --accent: #e0630e;
      --accent-soft: rgba(224, 99, 14, 0.11);
      --accent-text: #c25106;
      --check-bg: rgba(16, 185, 129, 0.12);
      --check-border: #10b981;
      --check-text: #047857;
      --warn-bg: rgba(217, 119, 6, 0.1);
      --warn-text: #b45309;
      --shadow: 0 10px 28px rgba(31, 36, 45, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 20px 88px;
    }

    /* Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand .count-badge {
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .btn-accent:hover {
      filter: brightness(1.08);
      color: #fff;
    }

    .btn-basket {
      position: relative;
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .btn-basket.has-items {
      background: var(--accent);
      color: #fff;
    }

    .btn-basket .basket-pill {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.22);
      color: inherit;
    }

    /* Search & Filters */
    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 0 16px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 12px 84px 12px 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-shortcut, .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .search-shortcut {
      font-size: 0.78rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      pointer-events: none;
    }

    .search-clear {
      display: none;
      background: var(--bg-chip);
      border: none;
      color: var(--text);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .cat-pill {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-pill:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .cat-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .cat-pill.planned-pill {
      border-color: var(--check-border);
      color: var(--check-text);
    }

    .cat-pill.planned-pill.active {
      background: var(--check-border);
      border-color: var(--check-border);
      color: #0f1115;
    }

    .cat-pill .pill-count {
      opacity: 0.82;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    /* Recipe Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    .card.in-plan {
      border-color: var(--check-border);
      box-shadow: 0 0 0 1px var(--check-border);
    }

    .card-watermark {
      position: absolute;
      right: -6px;
      bottom: 28px;
      font-size: 4.2rem;
      font-weight: 800;
      color: var(--text);
      opacity: 0.035;
      pointer-events: none;
      user-select: none;
      line-height: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .card-cat {
      font-size: 0.76rem;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .card-ings {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .ing-tag {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--bg-chip);
      color: var(--text-muted);
    }

    .ing-tag.match, mark {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
      padding: 0 3px;
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-top: 10px;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 2;
    }

    .plan-toggle-btn {
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }

    .plan-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .plan-toggle-btn.added {
      background: var(--check-bg);
      border-color: var(--check-border);
      color: var(--check-text);
    }

    .warn-badge {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }

    /* Floating Basket Bar (Mobile friendly) */
    .floating-basket {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 40;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .floating-basket:hover {
      transform: translateY(-2px);
    }

    .floating-basket.visible {
      display: inline-flex;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 840px;
      max-height: 90vh;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-wide {
      max-width: 980px;
    }

    .modal-header {
      padding: 18px 24px 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .modal-close {
      background: var(--bg-chip);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 1.15rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-close:hover {
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .modal-body {
      padding: 22px 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1.55fr;
      gap: 24px;
    }

    .planner-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      min-height: 380px;
    }

    @media (max-width: 740px) {
      .modal-body, .planner-body {
        grid-template-columns: 1fr;
      }
      .modal-backdrop {
        padding: 10px;
      }
    }

    .note-banner {
      grid-column: 1 / -1;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 0.9rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .section-head h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-text);
      letter-spacing: 0.02em;
    }

    .reset-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-link:hover {
      color: var(--accent-text);
    }

    .ing-group-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ing-group-title:first-child {
      margin-top: 2px;
    }

    .ing-list, .step-list, .planned-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ing-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
      transition: all 0.12s ease;
    }

    .ing-item.checked {
      background: var(--check-bg);
      border-color: var(--check-border);
      opacity: 0.68;
    }

    .ing-item.checked .ing-main-text {
      text-decoration: line-through;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      border-radius: 5px;
      border: 2px solid var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .ing-item.checked .checkbox,
    .step-item.checked .checkbox {
      border-color: var(--check-border);
      background: var(--check-border);
      color: #0f1115;
      font-weight: 800;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .step-item:hover, .ing-item:hover {
      border-color: var(--accent);
    }

    .step-item.checked {
      background: var(--check-bg);
      border-color: var(--check-border);
      opacity: 0.75;
    }

    .step-badge {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent-text);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .step-text {
      font-size: 0.98rem;
      flex: 1;
    }

    /* Planner Specific */
    .planned-dish-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .planned-dish-link {
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      flex: 1;
    }

    .planned-dish-link:hover {
      color: var(--accent-text);
      text-decoration: underline;
    }

    .icon-remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .icon-remove-btn:hover {
      background: var(--bg-chip);
      color: var(--text);
    }

    .shop-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .custom-add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .custom-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .shop-item-content {
      flex: 1;
      min-width: 0;
    }

    .shop-item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dish-count-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .shop-item-sources {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .planner-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      flex-wrap: wrap;
    }

    .md-link {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
    }

    .md-link:hover {
      color: var(--accent-text);
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Lock Screen */
    .lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 26px;
      border-radius: 20px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .lock-icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .lock-card h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .lock-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .lock-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }

    .lock-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .lock-remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }

    .lock-submit {
      width: 100%;
      justify-content: center;
      padding: 11px 16px;
      font-size: 0.98rem;
    }

    .lock-error {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #f87171;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <!-- Client-Side AES-256-GCM Lock Screen -->
  <div class="lock-screen" id="lockScreen">
    <form class="lock-card" id="unlockForm">
      <div class="lock-icon">🔒</div>
      <h2>私密食譜筆記</h2>
      <p class="lock-sub">此頁內容經 AES-256 端對端加密，請輸入密碼解鎖</p>
      <input
        type="password"
        id="passphraseInput"
        class="lock-input"
        placeholder="請輸入解密密碼…"
        autocomplete="current-password"
        required
      />

      "🥚 蛋・豆製品・乳製品",
      "🍚 主食・乾貨・料理包",
      "📦 其他食材",
      "🧂 常備調味料"
    ];

    function loadPlanState() {
      try {
        const raw = localStorage.getItem(PLAN_STORAGE_KEY);
        if (!raw) throw new Error("empty");
        const parsed = JSON.parse(raw);
        return {
          plannedSlugs: Array.isArray(parsed.plannedSlugs) ? parsed.plannedSlugs : [],
          checkedItems: new Set(Array.isArray(parsed.checkedItems) ? parsed.checkedItems : []),
          customItems: Array.isArray(parsed.customItems) ? parsed.customItems : [],
          hidePantry: Boolean(parsed.hidePantry)
        };
      } catch {
        return {
          plannedSlugs: [],
          checkedItems: new Set(),
          customItems: [],
          hidePantry: false
        };
      }
    }

    function savePlanState() {
      const payload = {
        plannedSlugs: planState.plannedSlugs,
        checkedItems: Array.from(planState.checkedItems),
        customItems: planState.customItems,
        hidePantry: planState.hidePantry
      };
      localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(payload));
    }

    const planState = loadPlanState();

    const state = {
      query: "",
      category: "全部",
      filtered: [...RECIPES],
      activeSlug: null,
      plannerOpen: false,
      checks: {}
    };

    // Theme setup
    const savedTheme = localStorage.getItem("recipe-theme") || "dark";
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("recipe-theme", theme);
      document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️ 淺色" : "🌙 深色";
    }
    applyTheme(savedTheme);
    document.getElementById("themeBtn").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toastMsg");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlightText(text, terms) {
      let safe = escapeHtml(text);
      if (!terms.length) return safe;
      for (const t of terms) {
        const escapedTerm = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        safe = safe.replace(new RegExp(`(${escapedTerm})`, "gi"), "<mark>$1</mark>");
      }
      return safe;
    }

    function isPlanned(slug) {
      return planState.plannedSlugs.includes(slug);
    }

    function togglePlanRecipe(slug) {
      const idx = planState.plannedSlugs.indexOf(slug);
      const recipe = RECIPES.find((r) => r.slug === slug);
      if (idx >= 0) {
        planState.plannedSlugs.splice(idx, 1);
        if (state.category === PLANNED_FILTER_LABEL && planState.plannedSlugs.length === 0) {
          state.category = "全部";
        }
        if (recipe) showToast(`已從菜單移除「${recipe.title}」`);
      } else {
        planState.plannedSlugs.push(slug);
        if (recipe) showToast(`已加入菜單：「${recipe.title}」`);
      }
      savePlanState();
      updateBasketIndicators();
      renderCategories();
      updateFilter();
      if (state.activeSlug === slug) syncModalPlanButton(slug);
      if (state.plannerOpen) renderPlanner();
    }

    function updateBasketIndicators() {
      const count = planState.plannedSlugs.length;
      document.getElementById("headerBasketCount").textContent = count;
      document.getElementById("floatingBasketCount").textContent = count;

      const headerBtn = document.getElementById("openPlannerBtn");
      headerBtn.classList.toggle("has-items", count > 0);

      const floatBtn = document.getElementById("floatingBasketBtn");
      const hasAny = count > 0 || planState.customItems.length > 0;
      floatBtn.classList.toggle("visible", hasAny && !state.plannerOpen && !state.activeSlug);
    }

    function getCategories() {
      const counts = new Map();
      counts.set("全部", RECIPES.length);
      if (planState.plannedSlugs.length > 0) {
        counts.set(PLANNED_FILTER_LABEL, planState.plannedSlugs.length);
      }
      for (const r of RECIPES) {
        counts.set(r.category, (counts.get(r.category) || 0) + 1);
      }
      return Array.from(counts.entries());
    }

    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = getCategories()
        .map(([cat, count]) => {
          const active = state.category === cat ? "active" : "";
          const plannedCls = cat === PLANNED_FILTER_LABEL ? "planned-pill" : "";
          return `<button class="cat-pill ${plannedCls} ${active}" data-cat="${escapeHtml(cat)}" type="button">${escapeHtml(cat)}<span class="pill-count">${count}</span></button>`;
        })
        .join("");

      bar.querySelectorAll(".cat-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.cat;
          renderCategories();
          updateFilter();
        });
      });
    }

    function updateFilter() {
      const terms = state.query
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);

      state.filtered = RECIPES.filter((r) => {
        if (state.category === PLANNED_FILTER_LABEL) {
          if (!isPlanned(r.slug)) return false;
        } else if (state.category !== "全部" && r.category !== state.category) {
          return false;
        }
        if (!terms.length) return true;
        const haystack = [
          r.title,
          r.category,
          ...r.ingredients.map((i) => i.text),
          ...r.steps
        ]
          .join(" ")
          .toLowerCase();
        return terms.every((t) => haystack.includes(t));
      });

      document.getElementById("totalCount").textContent =
        state.filtered.length === RECIPES.length
          ? `${RECIPES.length} 道食譜`
          : `顯示 ${state.filtered.length} / ${RECIPES.length} 道`;

      renderGrid(terms);
    }

    function renderGrid(terms = []) {
      const grid = document.getElementById("recipeGrid");
      const empty = document.getElementById("emptyState");

      if (!state.filtered.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      grid.innerHTML = state.filtered
        .map((r) => {
          const previewIngs = r.ingredients.slice(0, 6);
          const extra = r.ingredients.length - previewIngs.length;
          const ingHtml = previewIngs
            .map((ing) => {
              const isMatch = terms.some((t) => ing.text.toLowerCase().includes(t));
              return `<span class="ing-tag ${isMatch ? "match" : ""}">${highlightText(ing.text, terms)}</span>`;
            })
            .join("") + (extra > 0 ? `<span class="ing-tag">+${extra}</span>` : "");

          const added = isPlanned(r.slug);
          const metaText = r.pending ? `<span class="warn-badge">待補充</span>` : `<span>${r.ingredients.length} 食材・${r.steps.length} 步驟</span>`;

          return `
            <article class="card ${added ? "in-plan" : ""}" data-slug="${escapeHtml(r.slug)}" tabindex="0">
              <div>
                <div class="card-top">
                  <span class="card-num">#${escapeHtml(r.num)}</span>
                  <span class="card-cat">${escapeHtml(r.category)}</span>
                </div>
                <h2 class="card-title">${highlightText(r.title, terms)}</h2>
                <div class="card-ings">${ingHtml}</div>
              </div>
              <div class="card-footer">
                ${metaText}
                <button class="plan-toggle-btn ${added ? "added" : ""}" data-plan-slug="${escapeHtml(r.slug)}" type="button">
                  ${added ? "✓ 已在菜單" : "+ 加入菜單"}
                </button>
              </div>
              <span class="card-watermark">${escapeHtml(r.title.slice(0, 2))}</span>
            </article>
          `;
        })
        .join("");

      grid.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("[data-plan-slug]")) return;
          openRecipe(card.dataset.slug);
        });
        card.addEventListener("keydown", (e) => {
          if (e.target.closest("[data-plan-slug]")) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openRecipe(card.dataset.slug);
          }
        });
      });

      grid.querySelectorAll("[data-plan-slug]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          togglePlanRecipe(btn.dataset.planSlug);
        });
      });
    }

    function syncModalPlanButton(slug) {
      const btn = document.getElementById("modalPlanToggleBtn");
      const added = isPlanned(slug);
      btn.classList.toggle("added", added);
      btn.textContent = added ? "✓ 已在菜單" : "+ 加入菜單";
      btn.onclick = () => togglePlanRecipe(slug);
    }

    function getRecipeCheckState(slug) {
      if (!state.checks[slug]) {
        state.checks[slug] = { ings: new Set(), steps: new Set() };
      }
      return state.checks[slug];
    }

    function openRecipe(slug, updateHash = true) {
      const recipe = RECIPES.find((r) => r.slug === slug);
      if (!recipe) return;
      if (state.plannerOpen) closePlanner();
      state.activeSlug = slug;
      if (updateHash && location.hash !== `#${slug}`) {
        history.pushState(null, "", `#${slug}`);
      }

      document.getElementById("modalNum").textContent = `#${recipe.num}`;
      document.getElementById("modalCat").textContent = recipe.category;
      document.getElementById("modalTitle").textContent = recipe.title;

      // Build downloadable Markdown blob in memory (works without hosting raw .md files)
      const mdLines = [`# ${recipe.title}`, ""];
      if (recipe.note) mdLines.push(`> ${recipe.note}`, "");
      mdLines.push(`## ${recipe.ingHeading || "食材"}`);
      let lastGrp = "";
      for (const ing of recipe.ingredients) {
        if (ing.group && ing.group !== lastGrp) {
          lastGrp = ing.group;
          mdLines.push("", `### ${lastGrp}`);
        }
        mdLines.push(`- ${ing.text}`);
      }
      mdLines.push("", "## 作法 (Instructions)");
      recipe.steps.forEach((st, i) => mdLines.push(`${i + 1}. ${st}`));
      const mdLink = document.getElementById("mdFileLink");
      if (mdLink.dataset.blobUrl) URL.revokeObjectURL(mdLink.dataset.blobUrl);
      const blobUrl = URL.createObjectURL(new Blob([mdLines.join("\n") + "\n"], { type: "text/markdown;charset=utf-8" }));
      mdLink.dataset.blobUrl = blobUrl;
      mdLink.href = blobUrl;
      mdLink.download = `${recipe.slug}.md`;

      syncModalPlanButton(slug);

      renderModalBody(recipe);

      const list = state.filtered.length ? state.filtered : RECIPES;
      const idx = list.findIndex((r) => r.slug === slug);
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx === -1 || idx >= list.length - 1;
      prevBtn.style.opacity = prevBtn.disabled ? "0.4" : "1";
      nextBtn.style.opacity = nextBtn.disabled ? "0.4" : "1";

      prevBtn.onclick = () => {
        if (idx > 0) openRecipe(list[idx - 1].slug);
      };
      nextBtn.onclick = () => {
        if (idx !== -1 && idx < list.length - 1) openRecipe(list[idx + 1].slug);
      };

      document.getElementById("modalBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
      updateBasketIndicators();
    }

    function renderModalBody(recipe) {
      const checks = getRecipeCheckState(recipe.slug);
      const hasChecks = checks.ings.size > 0 || checks.steps.size > 0;

      let ingHtml = "";
      let currentGroup = "";
      recipe.ingredients.forEach((ing, idx) => {
        if (ing.group && ing.group !== currentGroup) {
          currentGroup = ing.group;
          ingHtml += `<div class="ing-group-title">${escapeHtml(currentGroup)}</div>`;
        }
        const checked = checks.ings.has(idx);
        ingHtml += `
          <li class="ing-item ${checked ? "checked" : ""}" data-ing-idx="${idx}">
            <span class="checkbox">${checked ? "✓" : ""}</span>
            <span class="ing-main-text">${escapeHtml(ing.text)}</span>
          </li>
        `;
      });

      const stepHtml = recipe.steps
        .map((step, idx) => {
          const checked = checks.steps.has(idx);
          return `
            <li class="step-item ${checked ? "checked" : ""}" data-step-idx="${idx}">
              <span class="step-badge">Step ${idx + 1}</span>
              <span class="step-text">${escapeHtml(step)}</span>
              <span class="checkbox">${checked ? "✓" : ""}</span>
            </li>
          `;
        })
        .join("");

      const noteBanner = recipe.note
        ? `<div class="note-banner">💡 ${escapeHtml(recipe.note)}</div>`
        : "";

      const body = document.getElementById("modalBody");
      body.innerHTML = `
        ${noteBanner}
        <section>
          <div class="section-head">
            <h3>${escapeHtml(recipe.ingHeading || "食材")}</h3>
            ${hasChecks ? `<button class="reset-link" id="resetChecksBtn" type="button">重置勾選</button>` : ""}
          </div>
          <ul class="ing-list">${ingHtml}</ul>
        </section>
        <section>
          <div class="section-head">
            <h3>作法步驟</h3>
          </div>
          <ol class="step-list">${stepHtml}</ol>
        </section>
      `;

      body.querySelectorAll(".ing-item").forEach((el) => {
        el.addEventListener("click", () => {
          const i = Number(el.dataset.ingIdx);
          checks.ings.has(i) ? checks.ings.delete(i) : checks.ings.add(i);
          renderModalBody(recipe);
        });
      });

      body.querySelectorAll(".step-item").forEach((el) => {
        el.addEventListener("click", () => {
          const i = Number(el.dataset.stepIdx);
          checks.steps.has(i) ? checks.steps.delete(i) : checks.steps.add(i);
          renderModalBody(recipe);
        });
      });

      const resetBtn = document.getElementById("resetChecksBtn");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          checks.ings.clear();
          checks.steps.clear();
          renderModalBody(recipe);
        });
      }
    }

    function closeModal(updateHash = true) {
      state.activeSlug = null;
      document.getElementById("modalBackdrop").classList.remove("open");
      if (!state.plannerOpen) document.body.style.overflow = "";
      if (updateHash && location.hash) {
        history.pushState(null, "", location.pathname + location.search);
      }
      updateBasketIndicators();
    }

    document.getElementById("modalClose").addEventListener("click", () => closeModal());
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    // ================= Meal Planner & Shopping List =================
    function buildAggregatedShoppingGroups() {
      const merged = new Map();
      const plannedRecipes = planState.plannedSlugs
        .map((s) => RECIPES.find((r) => r.slug === s))
        .filter(Boolean);

      for (const recipe of plannedRecipes) {
        for (const ing of recipe.ingredients) {
          if (ing.skip) continue;
          const canonical = ing.canonical || ing.text.trim();
          const aisle = ing.aisle || "📦 其他食材";
          if (!merged.has(canonical)) {
            merged.set(canonical, {
              key: `ing:${canonical}`,
              name: canonical,
              aisle,
              dishes: [],
              isCustom: false
            });
          }
          const entry = merged.get(canonical);
          if (!entry.dishes.includes(recipe.title)) {
            entry.dishes.push(recipe.title);
          }
        }
      }

      const byAisle = new Map();
      for (const aisle of AISLE_ORDER) byAisle.set(aisle, []);

      for (const c of planState.customItems) {
        byAisle.get("📝 自訂採買項目").push({
          key: `custom:${c.id}`,
          customId: c.id,
          name: c.text,
          aisle: "📝 自訂採買項目",
          dishes: [],
          isCustom: true
        });
      }

      for (const item of merged.values()) {
        const list = byAisle.get(item.aisle) || byAisle.get("📦 其他食材");
        list.push(item);
      }

      return { plannedRecipes, byAisle };
    }

    function openPlanner() {
      if (state.activeSlug) closeModal();
      state.plannerOpen = true;
      renderPlanner();
      document.getElementById("plannerBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
      updateBasketIndicators();
    }

    function closePlanner() {
      state.plannerOpen = false;
      document.getElementById("plannerBackdrop").classList.remove("open");
      if (!state.activeSlug) document.body.style.overflow = "";
      updateBasketIndicators();
    }

    function renderPlanner() {
      const { plannedRecipes, byAisle } = buildAggregatedShoppingGroups();

      // 1. Left column: Planned Menu
      document.getElementById("plannedMenuHeading").textContent = `本次菜單 (${plannedRecipes.length} 道)`;
      const clearMenuBtn = document.getElementById("clearMenuBtn");
      clearMenuBtn.style.display = plannedRecipes.length > 0 ? "inline" : "none";

      const menuContainer = document.getElementById("plannedMenuContainer");
      if (!plannedRecipes.length) {
        menuContainer.innerHTML = `
          <div class="planner-empty">
            尚未選擇菜色。<br/>在食譜卡片點選「<strong>+ 加入菜單</strong>」，即可自動彙整採買清單！
          </div>
        `;
      } else {
        menuContainer.innerHTML = `
          <ul class="planned-list">
            ${plannedRecipes
              .map(
                (r) => `
              <li class="planned-dish-item">
                <button class="planned-dish-link" data-open-slug="${escapeHtml(r.slug)}" type="button">
                  <span style="color: var(--text-muted); font-size: 0.8rem; margin-right: 4px;">#${escapeHtml(r.num)}</span>
                  ${escapeHtml(r.title)}
                </button>
                <button class="icon-remove-btn" data-remove-slug="${escapeHtml(r.slug)}" type="button" title="移除此道菜">✕</button>
              </li>
            `
              )
              .join("")}
          </ul>
        `;

        menuContainer.querySelectorAll("[data-open-slug]").forEach((btn) => {
          btn.addEventListener("click", () => openRecipe(btn.dataset.openSlug));
        });
        menuContainer.querySelectorAll("[data-remove-slug]").forEach((btn) => {
          btn.addEventListener("click", () => togglePlanRecipe(btn.dataset.removeSlug));
        });
      }

      // 2. Right column: Shopping List
      const togglePantryBtn = document.getElementById("togglePantryBtn");
      const pantryCount = (byAisle.get("🧂 常備調味料") || []).length;
      togglePantryBtn.textContent = planState.hidePantry
        ? `顯示常備調味料 (${pantryCount})`
        : "隱藏常備調味料";

      let visibleTotal = 0;
      let uncheckedCount = 0;
      let anyChecked = false;
      let listHtml = "";

      for (const [aisle, items] of byAisle.entries()) {
        if (!items.length) continue;
        if (aisle === "🧂 常備調味料" && planState.hidePantry) continue;

        visibleTotal += items.length;
        const groupUnchecked = items.filter((it) => !planState.checkedItems.has(it.key)).length;
        uncheckedCount += groupUnchecked;

        listHtml += `<div class="ing-group-title"><span>${escapeHtml(aisle)}</span><span>${groupUnchecked} / ${items.length}</span></div>`;
        listHtml += `<ul class="ing-list">`;
        for (const it of items) {
          const checked = planState.checkedItems.has(it.key);
          if (checked) anyChecked = true;
          const multiBadge =
            it.dishes.length >= 2
              ? `<span class="dish-count-badge">×${it.dishes.length} 道</span>`
              : "";
          const sourcesHtml = it.dishes.length
            ? `<div class="shop-item-sources">${escapeHtml(it.dishes.join("、"))}</div>`
            : "";
          const removeCustomBtn = it.isCustom
            ? `<button class="icon-remove-btn" data-del-custom="${escapeHtml(it.customId)}" type="button" title="刪除自訂項目">✕</button>`
            : "";

          listHtml += `
            <li class="ing-item ${checked ? "checked" : ""}" data-shop-key="${escapeHtml(it.key)}">
              <span class="checkbox">${checked ? "✓" : ""}</span>
              <div class="shop-item-content">
                <div class="shop-item-top">
                  <span class="ing-main-text">${escapeHtml(it.name)}</span>
                  ${multiBadge}
                </div>
                ${sourcesHtml}
              </div>
              ${removeCustomBtn}
            </li>
          `;
        }
        listHtml += `</ul>`;
      }

      document.getElementById("shoppingListHeading").textContent =
        visibleTotal > 0 ? `採買清單 (待買 ${uncheckedCount} / ${visibleTotal})` : "採買清單";

      const resetShopChecksBtn = document.getElementById("resetShopChecksBtn");
      resetShopChecksBtn.style.display = anyChecked ? "inline" : "none";

      const shopContainer = document.getElementById("shoppingListContainer");
      if (!listHtml) {
        shopContainer.innerHTML = `
          <div class="planner-empty">
            目前沒有待採買項目。<br/>選擇食譜或在上方輸入自訂採買項目即可開始！
          </div>
        `;
      } else {
        shopContainer.innerHTML = listHtml;
        shopContainer.querySelectorAll("[data-shop-key]").forEach((el) => {
          el.addEventListener("click", (e) => {
            if (e.target.closest("[data-del-custom]")) return;
            const key = el.dataset.shopKey;
            planState.checkedItems.has(key)
              ? planState.checkedItems.delete(key)
              : planState.checkedItems.add(key);
            savePlanState();
            renderPlanner();
          });
        });

        shopContainer.querySelectorAll("[data-del-custom]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = btn.dataset.delCustom;
            planState.customItems = planState.customItems.filter((c) => c.id !== id);
            planState.checkedItems.delete(`custom:${id}`);
            savePlanState();
            updateBasketIndicators();
            renderPlanner();
          });
        });
      }
    }

    function formatPlainBulletList() {
      const { plannedRecipes, byAisle } = buildAggregatedShoppingGroups();
      const lines = [];

      if (plannedRecipes.length) {
        lines.push(`【本次菜單（${plannedRecipes.length} 道）】`);
        for (const r of plannedRecipes) {
          lines.push(`- ${r.title}`);
        }
        lines.push("");
      }

      let itemCount = 0;
      for (const [aisle, items] of byAisle.entries()) {
        if (!items.length) continue;
        if (aisle === "🧂 常備調味料" && planState.hidePantry) continue;
        const unchecked = items.filter((it) => !planState.checkedItems.has(it.key));
        if (!unchecked.length) continue;

        lines.push(`【${aisle}】`);
        for (const it of unchecked) {
          itemCount++;
          if (it.dishes.length >= 2) {
            lines.push(`- ${it.name}（×${it.dishes.length} 道：${it.dishes.join("、")}）`);
          } else if (it.dishes.length === 1) {
            lines.push(`- ${it.name}（${it.dishes[0]}）`);
          } else {
            lines.push(`- ${it.name}`);
          }
        }
        lines.push("");
      }

      return { text: lines.join("\n").trim(), itemCount };
    }

    async function copyTextSafe(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch {}
      document.body.removeChild(ta);
      return ok;
    }

    document.getElementById("openPlannerBtn").addEventListener("click", openPlanner);
    document.getElementById("floatingBasketBtn").addEventListener("click", openPlanner);
    document.getElementById("plannerClose").addEventListener("click", closePlanner);
    document.getElementById("plannerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "plannerBackdrop") closePlanner();
    });

    document.getElementById("clearMenuBtn").addEventListener("click", () => {
      planState.plannedSlugs = [];
      for (const key of Array.from(planState.checkedItems)) {
        if (key.startsWith("ing:")) planState.checkedItems.delete(key);
      }
      if (state.category === PLANNED_FILTER_LABEL) state.category = "全部";
      savePlanState();
      updateBasketIndicators();
      renderCategories();
      updateFilter();
      renderPlanner();
      showToast("已清空本次菜單");
    });

    document.getElementById("togglePantryBtn").addEventListener("click", () => {
      planState.hidePantry = !planState.hidePantry;
      savePlanState();
      renderPlanner();
    });

    document.getElementById("resetShopChecksBtn").addEventListener("click", () => {
      planState.checkedItems.clear();
      savePlanState();
      renderPlanner();
    });

    document.getElementById("customItemForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("customItemInput");
      const val = input.value.trim();
      if (!val) return;
      planState.customItems.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text: val
      });
      input.value = "";
      savePlanState();
      updateBasketIndicators();
      renderPlanner();
    });

    document.getElementById("copyListBtn").addEventListener("click", async () => {
      const { text, itemCount } = formatPlainBulletList();
      if (!text) {
        showToast("目前沒有未勾選的採買項目可複製");
        return;
      }
      const ok = await copyTextSafe(text);
      showToast(ok ? `✓ 已複製採買清單（${itemCount} 項待買）` : "複製失敗，請手動選取");
    });

    // Search events
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");
    const searchShortcut = document.getElementById("searchShortcut");

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value;
      const hasVal = state.query.length > 0;
      searchClear.style.display = hasVal ? "block" : "none";
      searchShortcut.style.display = hasVal ? "none" : "block";
      updateFilter();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      state.query = "";
      searchClear.style.display = "none";
      searchShortcut.style.display = "block";
      updateFilter();
      searchInput.focus();
    });

    // Random recipe button
    document.getElementById("randomBtn").addEventListener("click", () => {
      const pool = (state.filtered.length ? state.filtered : RECIPES).filter((r) => !r.pending);
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      openRecipe(pick.slug);
    });

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchInput && !state.activeSlug && !state.plannerOpen) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === "Escape") {
        if (state.activeSlug) closeModal();
        else if (state.plannerOpen) closePlanner();
      } else if (state.activeSlug && e.key === "ArrowLeft") {
        document.getElementById("prevBtn").click();
      } else if (state.activeSlug && e.key === "ArrowRight") {
        document.getElementById("nextBtn").click();
      }
    });

    // Hash routing
    function syncFromHash() {
      if (!RECIPES.length) return;
      const slug = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (slug && RECIPES.some((r) => r.slug === slug)) {
        openRecipe(slug, false);
      } else if (state.activeSlug) {
        closeModal(false);
      }
    }
    window.addEventListener("hashchange", syncFromHash);

    // ================= Client-Side AES-256-GCM Decryption =================
    // Compact Pure-JS fallback for file:// contexts where window.crypto.subtle is unavailable
    const PureCrypto = (() => {
      const K = new Uint32Array([
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ]);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      const INIT = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
      const W = new Uint32Array(64);

      function sha256Compress(H, W, block, off) {
        for (let i = 0; i < 16; i++) {
          W[i] = ((block[off + i*4] << 24) | (block[off + i*4 + 1] << 16) | (block[off + i*4 + 2] << 8) | block[off + i*4 + 3]) >>> 0;
        }
        for (let i = 16; i < 64; i++) {
          const s0 = rotr(W[i-15], 7) ^ rotr(W[i-15], 18) ^ (W[i-15] >>> 3);
          const s1 = rotr(W[i-2], 17) ^ rotr(W[i-2], 19) ^ (W[i-2] >>> 10);
          W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0;
        }
        let [a,b,c,d,e,f,g,h] = H;
        for (let i = 0; i < 64; i++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
        H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
      }

      function sha256(msg) {
        const len = msg.length;
        const padLen = ((len + 9 + 63) & ~63);
        const buf = new Uint8Array(padLen);
        buf.set(msg);
        buf[len] = 0x80;
        const dv = new DataView(buf.buffer);
        dv.setUint32(padLen - 8, Math.floor((len * 8) / 0x100000000), false);
        dv.setUint32(padLen - 4, (len * 8) >>> 0, false);
        const H = new Uint32Array(INIT);
        for (let off = 0; off < padLen; off += 64) sha256Compress(H, W, buf, off);
        const out = new Uint8Array(32);
        const odv = new DataView(out.buffer);
        for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i], false);
        return out;
      }

      function pbkdf2Sha256(pwdBytes, salt, iterations) {
        let key = pwdBytes.length > 64 ? sha256(pwdBytes) : pwdBytes;
        const ipad = new Uint8Array(64), opad = new Uint8Array(64);
        for (let i = 0; i < 64; i++) {
          const b = i < key.length ? key[i] : 0;
          ipad[i] = b ^ 0x36; opad[i] = b ^ 0x5c;
        }
        const iState = new Uint32Array(INIT), oState = new Uint32Array(INIT);
        sha256Compress(iState, W, ipad, 0);
        sha256Compress(oState, W, opad, 0);

        const blockBuf = new Uint8Array(64);
        blockBuf[32] = 0x80;
        new DataView(blockBuf.buffer).setUint32(60, (64 + 32) * 8, false);
        const H = new Uint32Array(8);

        const firstMsg = new Uint8Array(64 + salt.length + 4);
        firstMsg.set(ipad); firstMsg.set(salt, 64); firstMsg[64 + salt.length + 3] = 1;
        const inner1 = sha256(firstMsg);
        const outer1 = new Uint8Array(64 + 32);
        outer1.set(opad); outer1.set(inner1, 64);
        let U = sha256(outer1);
        const T = new Uint32Array(8);
        const udv = new DataView(U.buffer);
        for (let j = 0; j < 8; j++) T[j] = udv.getUint32(j * 4, false);

        for (let iter = 1; iter < iterations; iter++) {
          blockBuf.set(U, 0);
          H.set(iState);
          sha256Compress(H, W, blockBuf, 0);
          for (let j = 0; j < 8; j++) {
            const v = H[j];
            blockBuf[j*4] = v >>> 24; blockBuf[j*4+1] = v >>> 16; blockBuf[j*4+2] = v >>> 8; blockBuf[j*4+3] = v;
          }
          H.set(oState);
          sha256Compress(H, W, blockBuf, 0);
          for (let j = 0; j < 8; j++) {
            const v = H[j];
            T[j] ^= v;
            U[j*4] = v >>> 24; U[j*4+1] = v >>> 16; U[j*4+2] = v >>> 8; U[j*4+3] = v;
          }
        }
        const out = new Uint8Array(32);
        const odv = new DataView(out.buffer);
        for (let j = 0; j < 8; j++) odv.setUint32(j * 4, T[j], false);
        return out;
      }

      const SBOX = new Uint8Array(256), RCON = new Uint8Array(15);
      (() => {
        const p = new Uint8Array(256), q = new Uint8Array(256);
        let x = 1;
        for (let i = 0; i < 255; i++) {
          p[i] = x; q[x] = i;
          x ^= (x << 1) ^ ((x & 0x80) ? 0x11b : 0);
        }
        p[255] = 1;
        SBOX[0] = 0x63;
        for (let i = 1; i < 256; i++) {
          let y = p[255 - q[i]];
          y ^= ((y << 1) | (y >>> 7)) ^ ((y << 2) | (y >>> 6)) ^ ((y << 3) | (y >>> 5)) ^ ((y << 4) | (y >>> 4)) ^ 0x63;
          SBOX[i] = y & 0xff;
        }
        let r = 1;
        for (let i = 1; i < 15; i++) { RCON[i] = r; r = (r << 1) ^ ((r & 0x80) ? 0x11b : 0); }
      })();

      const xtime = (a) => ((a << 1) ^ ((a & 0x80) ? 0x1b : 0)) & 0xff;

      function aesExpandKey(key) {
        const w = new Uint8Array(240);
        w.set(key);
        for (let i = 32; i < 240; i += 4) {
          let t0 = w[i-4], t1 = w[i-3], t2 = w[i-2], t3 = w[i-1];
          if (i % 32 === 0) {
            const tmp = t0;
            t0 = SBOX[t1] ^ RCON[i / 32]; t1 = SBOX[t2]; t2 = SBOX[t3]; t3 = SBOX[tmp];
          } else if (i % 32 === 16) {
            t0 = SBOX[t0]; t1 = SBOX[t1]; t2 = SBOX[t2]; t3 = SBOX[t3];
          }
          w[i] = w[i-32] ^ t0; w[i+1] = w[i-31] ^ t1; w[i+2] = w[i-30] ^ t2; w[i+3] = w[i-29] ^ t3;
        }
        return w;
      }

      function aesEncryptBlock(rk, inp, out) {
        const s = new Uint8Array(16), t = new Uint8Array(16);
        for (let i = 0; i < 16; i++) s[i] = inp[i] ^ rk[i];
        for (let round = 1; round <= 14; round++) {
          const ro = round * 16;
          for (let i = 0; i < 16; i++) t[i] = SBOX[s[(i + (i & 3) * 4) & 15]];
          if (round < 14) {
            for (let c = 0; c < 16; c += 4) {
              const a0 = t[c], a1 = t[c+1], a2 = t[c+2], a3 = t[c+3];
              const u = a0 ^ a1 ^ a2 ^ a3;
              s[c]   = a0 ^ u ^ xtime(a0 ^ a1) ^ rk[ro+c];
              s[c+1] = a1 ^ u ^ xtime(a1 ^ a2) ^ rk[ro+c+1];
              s[c+2] = a2 ^ u ^ xtime(a2 ^ a3) ^ rk[ro+c+2];
              s[c+3] = a3 ^ u ^ xtime(a3 ^ a0) ^ rk[ro+c+3];
            }
          } else {
            for (let i = 0; i < 16; i++) out[i] = t[i] ^ rk[ro+i];
          }
        }
      }

      function ghashMul(X, Y) {
        const Z = new Uint8Array(16), V = new Uint8Array(Y);
        for (let i = 0; i < 128; i++) {
          if ((X[i >>> 3] >>> (7 - (i & 7))) & 1) {
            for (let b = 0; b < 16; b++) Z[b] ^= V[b];
          }
          const lsb = V[15] & 1;
          for (let b = 15; b > 0; b--) V[b] = (V[b] >>> 1) | ((V[b-1] & 1) << 7);
          V[0] >>>= 1;
          if (lsb) V[0] ^= 0xe1;
        }
        return Z;
      }

      function decryptAesGcm(rawKey, iv, dataWithTag) {
        if (dataWithTag.length < 16) throw new Error("Invalid ciphertext");
        const ctLen = dataWithTag.length - 16;
        const ct = dataWithTag.subarray(0, ctLen);
        const tag = dataWithTag.subarray(ctLen);
        const rk = aesExpandKey(rawKey);
        const H = new Uint8Array(16);
        aesEncryptBlock(rk, new Uint8Array(16), H);

        let S = new Uint8Array(16);
        const blk = new Uint8Array(16);
        for (let off = 0; off < ctLen; off += 16) {
          blk.fill(0);
          blk.set(ct.subarray(off, Math.min(off + 16, ctLen)));
          for (let b = 0; b < 16; b++) S[b] ^= blk[b];
          S = ghashMul(S, H);
        }
        const lenBlk = new Uint8Array(16);
        const dv = new DataView(lenBlk.buffer);
        dv.setUint32(12, (ctLen * 8) >>> 0, false);
        dv.setUint32(8, Math.floor((ctLen * 8) / 0x100000000), false);
        for (let b = 0; b < 16; b++) S[b] ^= lenBlk[b];
        S = ghashMul(S, H);

        const J0 = new Uint8Array(16);
        J0.set(iv); J0[15] = 1;
        const E_J0 = new Uint8Array(16);
        aesEncryptBlock(rk, J0, E_J0);

        let diff = 0;
        for (let b = 0; b < 16; b++) diff |= (S[b] ^ E_J0[b]) ^ tag[b];
        if (diff !== 0) throw new Error("Wrong passphrase");

        const pt = new Uint8Array(ctLen);
        const ctr = new Uint8Array(J0);
        const ks = new Uint8Array(16);
        const cdv = new DataView(ctr.buffer);
        let counter = 2;
        for (let off = 0; off < ctLen; off += 16) {
          cdv.setUint32(12, counter++, false);
          aesEncryptBlock(rk, ctr, ks);
          const end = Math.min(off + 16, ctLen);
          for (let i = off; i < end; i++) pt[i] = ct[i] ^ ks[i - off];
        }
        return pt;
      }

      return { pbkdf2Sha256, decryptAesGcm };
    })();

    const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const bytesToB64 = (bytes) => btoa(String.fromCharCode(...bytes));

    async function decryptRecipesBundle(bundle, passphrase, cachedKeyB64 = null) {
      const iv = b64ToBytes(bundle.iv);
      const data = b64ToBytes(bundle.data);
      let rawKeyBytes;

      if (window.crypto && window.crypto.subtle) {
        if (cachedKeyB64) {
          rawKeyBytes = b64ToBytes(cachedKeyB64);
        } else {
          const salt = b64ToBytes(bundle.salt);
          const baseKey = await window.crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(passphrase),
            "PBKDF2",
            false,
            ["deriveBits"]
          );
          const bits = await window.crypto.subtle.deriveBits(
            { name: "PBKDF2", salt, iterations: bundle.iter, hash: "SHA-256" },
            baseKey,
            256
          );
          rawKeyBytes = new Uint8Array(bits);
        }
        const aesKey = await window.crypto.subtle.importKey("raw", rawKeyBytes, "AES-GCM", false, ["decrypt"]);
        const ptBuf = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, data);
        return {
          recipes: JSON.parse(new TextDecoder().decode(ptBuf)),
          keyB64: bytesToB64(rawKeyBytes)
        };
      } else {
        // Fallback for local file:// URLs without Web Crypto subtle
        if (cachedKeyB64) {
          rawKeyBytes = b64ToBytes(cachedKeyB64);
        } else {
          const salt = b64ToBytes(bundle.salt);
          rawKeyBytes = PureCrypto.pbkdf2Sha256(new TextEncoder().encode(passphrase), salt, bundle.iter);
        }
        const ptBytes = PureCrypto.decryptAesGcm(rawKeyBytes, iv, data);
        return {
          recipes: JSON.parse(new TextDecoder().decode(ptBytes)),
          keyB64: bytesToB64(rawKeyBytes)
        };
      }
    }

    function activateUnlockedApp(recipes) {
      RECIPES = recipes;
      state.filtered = [...RECIPES];
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("appContainer").style.display = "block";
      updateBasketIndicators();
      renderCategories();
      updateFilter();
      syncFromHash();
    }

    function lockApp() {
      localStorage.removeItem(UNLOCK_KEY_STORAGE);
      closeModal(false);
      closePlanner();
      RECIPES = [];
      state.filtered = [];
      document.getElementById("recipeGrid").innerHTML = "";
      document.getElementById("appContainer").style.display = "none";
      document.getElementById("lockScreen").style.display = "flex";
      document.getElementById("passphraseInput").value = "";
      document.getElementById("lockError").textContent = "";
      document.getElementById("passphraseInput").focus();
      showToast("已鎖定並清除此裝置的解鎖金鑰");
    }

    document.getElementById("lockAppBtn").addEventListener("click", lockApp);

    document.getElementById("unlockForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("passphraseInput");
      const btn = document.getElementById("unlockSubmitBtn");
      const errEl = document.getElementById("lockError");
      const remember = document.getElementById("rememberDeviceCheck").checked;
      const pwd = input.value;
      if (!pwd || !ENC_RECIPES) return;

      btn.disabled = true;
      btn.textContent = "解密中…";
      errEl.textContent = "";

      // Allow UI to paint "解密中…" before running PBKDF2
      await new Promise((r) => setTimeout(r, 20));

      try {
        const { recipes, keyB64 } = await decryptRecipesBundle(ENC_RECIPES, pwd, null);
        if (remember) {
          localStorage.setItem(UNLOCK_KEY_STORAGE, keyB64);
        } else {
          localStorage.removeItem(UNLOCK_KEY_STORAGE);
        }
        input.value = "";
        activateUnlockedApp(recipes);
      } catch {
        errEl.textContent = "密碼錯誤，請重新輸入";
        input.select();
      } finally {
        btn.disabled = false;
        btn.textContent = "解鎖食譜";
      }
    });

    // Startup: Auto-unlock if trusted device has cached 256-bit key
    (async () => {
      if (!ENC_RECIPES) {
        document.getElementById("lockError").textContent = "尚未寫入加密資料，請先執行 sync-html.ps1";
        return;
      }
      const cachedKey = localStorage.getItem(UNLOCK_KEY_STORAGE);
      if (cachedKey) {
        try {
          const { recipes } = await decryptRecipesBundle(ENC_RECIPES, "", cachedKey);
          activateUnlockedApp(recipes);
          return;
        } catch {
          localStorage.removeItem(UNLOCK_KEY_STORAGE);
        }
      }
      document.getElementById("passphraseInput").focus();
    })();
  </script>
